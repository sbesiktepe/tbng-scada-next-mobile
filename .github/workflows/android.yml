name: Android app

# Builds the TBNG SCADA Android app (Trusted Web Activity for scada2.tbngltd.com).
# Run it from GitHub: Actions -> Android app -> Run workflow. The APK is attached to the run
# (Artifacts: tbng-scada-apk). Signing: see README.md (GitHub secrets).
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown on the phone (e.g. 1.0)"
        default: "1.0"
  push:
    branches: [main]
    paths-ignore: ["**.md"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tbng.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/tbng.jks" >> "$GITHUB_ENV"
            echo "Signing with the TBNG key"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a debug key (test only)"
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.event.inputs.version_name || '1.0' }}
        run: gradle --no-daemon assembleRelease bundleRelease
      - name: Name the files
        run: |
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk "out/tbng-scada-${{ github.run_number }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "out/tbng-scada-${{ github.run_number }}.aab"
          keytool -printcert -jarfile "out/tbng-scada-${{ github.run_number }}.apk" | grep -i "SHA256:" | tee out/certificate-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tbng-scada-apk
          path: out/
